<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient
            id="moveflixGradient"
            x1="120"
            y1="120"
            x2="392"
            y2="392"
            gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FD8161"/>
<!--            <stop offset="50%" stop-color="#FF5A6E"/>-->
            <stop offset="100%" stop-color="#FF5A5F"/>
        </linearGradient>
    </defs>

    <!-- Top wave -->
    <path
        d="M140 180
       C185 140 235 140 280 180
       C325 220 375 220 420 180"
        stroke="url(#moveflixGradient)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Bottom wave -->
    <path
        d="M140 280
       C185 240 235 240 280 280
       C325 320 375 320 420 280"
        stroke="url(#moveflixGradient)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>