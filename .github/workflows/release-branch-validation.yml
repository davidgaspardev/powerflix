name: Validate release branch origin

on:
  create:

jobs:
  validate-release-origin:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch was created from develop
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          if [[ ! "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ Not a versioned release branch, skipping."
            exit 0
          fi

          git fetch origin develop
          MERGE_BASE=$(git merge-base HEAD origin/develop)
          DEVELOP_TIP=$(git rev-parse origin/develop)

          if [ "$MERGE_BASE" != "$DEVELOP_TIP" ]; then
            echo "❌ Release branches must be created from the tip of 'develop'."
            echo "   Please update your branch from develop before proceeding."
            exit 1
          fi

          echo "✅ Release branch '$BRANCH' correctly originates from develop."